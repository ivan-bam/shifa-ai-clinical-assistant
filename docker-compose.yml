services:
  db:
    image: pgvector/pgvector:pg16
    container_name: shifa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: shifa_db
    ports:
      - "5432:5432"
    volumes:
      - shifa_pgdata:/var/lib/postgresql/data

volumes:
  shifa_pgdata:
